<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Visite · ultime 24 ore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=8">
</head>
<body class="admin-page" data-theme="dark">
  <main class="admin-wrap admin-wrap--wide">
    <header class="admin-hero">
      <div class="admin-intro">
        <p class="admin-eyebrow">Area riservata</p>
        <h1>Qualcuno è entrato?</h1>
        <p class="admin-lead">
          Solo un segnale sulle ultime 24 ore e quale pagina è stata visitata per ultima.
        </p>
      </div>

      <section class="school-clock" aria-label="Ora locale del plesso Meucci">
        <div class="school-clock__scene" aria-hidden="true">
          <span class="school-clock__sun"><i></i></span>
          <span class="school-clock__cloud school-clock__cloud--one"><i></i></span>
          <span class="school-clock__cloud school-clock__cloud--two"><i></i></span>
          <span class="school-clock__wind school-clock__wind--one"><i></i></span>
          <span class="school-clock__wind school-clock__wind--two"><i></i></span>
          <span class="school-clock__rain school-clock__rain--one"></span>
          <span class="school-clock__rain school-clock__rain--two"></span>
          <span class="school-clock__lightning"></span>
          <img src="img/meucci-isometrica.png" alt="" width="1100" height="619">
        </div>
        <div class="school-clock__display">
          <p class="school-clock__place">Plesso Meucci · Acireale</p>
          <time class="school-clock__time" id="school-clock-time">--:--:--</time>
          <p class="school-clock__date" id="school-clock-date">Ora locale</p>
          <p class="school-clock__weather" id="school-clock-weather" aria-live="polite">Meteo in aggiornamento…</p>
          <a class="school-clock__source" href="https://open-meteo.com/" target="_blank" rel="noopener">Dati meteo Open-Meteo</a>
        </div>
      </section>
    </header>

    <div class="admin-toolbar">
      <div class="admin-segnale-box">
        <p class="admin-totale-24h" id="stats-segnale" data-stato="attesa">—</p>
        <p class="admin-ultima" id="stats-ultima">—</p>
        <p class="admin-pagina" id="stats-pagina" hidden></p>
        <p class="admin-stato" id="stats-stato">Caricamento…</p>
      </div>
      <div class="admin-azioni">
        <button type="button" class="admin-btn admin-btn--primary" data-admin-refresh>Aggiorna</button>
        <button type="button" class="admin-btn admin-btn--ghost" data-admin-logout>Esci</button>
      </div>
    </div>
  </main>
  <footer class="admin-footer">
    <p>Realizzato dal Prof. Rossano Bella</p>
  </footer>
  <script src="js/config.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="../../js/data.js?v=30" defer></script>
  <script src="../../js/access-track.js?v=7" defer></script>
  <script src="js/stats.js?v=7" defer></script>
  <script src="js/school-clock.js?v=4" defer></script>
</body>
</html>
