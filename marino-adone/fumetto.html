<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Fumetto · L’Adone | Scuola</title>
  <meta name="description" content="Quattro tavole: la storia dell’Adone di Giovan Battista Marino.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fumetto.css">
</head>
<body>
  <a class="skip-link visually-hidden" href="#contenuto">Salta al contenuto</a>
  <div class="bar-frame">
    <div class="bar-curtain" aria-hidden="true"></div>
    <header class="bar-top">
      <a class="bar-brand" href="index.html">Marino e l’Adone</a>
      <nav class="bar-nav" aria-label="Sezioni">
        <a href="index.html">Slide</a>
        <a href="fumetto.html">Fumetto</a>
      </nav>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Chiaro</button>
    </header>

    <main id="contenuto" class="bar-main" tabindex="-1">
      <header class="page-fumetto-intro">
        <img src="img/og-share.jpg" alt="Venere e Adone" width="240" height="126" style="aspect-ratio:1/1;object-fit:cover">
        <div>
          <p class="kicker">Fumetto · 4 tavole</p>
          <h1 class="serif">L’Adone a fumetti</h1>
          <p>Amore si vendica, Venere si innamora di Adone, Marte è geloso. Come finisce?</p>
        </div>
      </header>

      <section class="fumetto-reader" id="fumetto-stage" aria-roledescription="fumetto" aria-label="L’Adone a fumetti">
        <div class="fumetto-toolbar">
          <p class="fumetto-status">Tavola <span id="fumetto-num">1</span> di 4</p>
          <div class="fumetto-toolbar-actions">
            <button type="button" class="btn btn-secondary fumetto-print" id="fumetto-print">Stampa tutto</button>
            <button type="button" class="btn btn-secondary fumetto-full" id="fumetto-fullscreen" aria-pressed="false">Schermo intero</button>
          </div>
        </div>

        <div class="fumetto-viewport" id="fumetto-viewport">
          <figure class="fumetto-page is-active" data-page="1">
            <img src="img/tavole/tavola-01.jpg" alt="Tavola 1: Venere sgrida Amore; Amore porta Adone a Cipro; Venere vede Adone e Amore la colpisce con una freccia." width="1920" height="1080" fetchpriority="high">
          </figure>
          <figure class="fumetto-page" data-page="2" aria-hidden="true">
            <img src="img/tavole/tavola-02.jpg" alt="Tavola 2: Adone cura Venere e si innamora; il giardino del Piacere; Marte è geloso." width="1920" height="1080" loading="lazy">
          </figure>
          <figure class="fumetto-page" data-page="3" aria-hidden="true">
            <img src="img/tavole/tavola-03.jpg" alt="Tavola 3: l’anello magico e la fuga; la maga Falsirena; Adone diventa pappagallo e vola via." width="1920" height="1080" loading="lazy">
          </figure>
          <figure class="fumetto-page" data-page="4" aria-hidden="true">
            <img src="img/tavole/tavola-04.jpg" alt="Tavola 4: Adone diventa re ma lascia il potere; il cinghiale; Venere trasforma il cuore di Adone in un anemone." width="1920" height="1080" loading="lazy">
          </figure>
        </div>

        <p class="fumetto-caption" id="fumetto-caption" aria-live="polite"></p>

        <div class="fumetto-controls">
          <button type="button" class="btn btn-secondary fumetto-nav" id="fumetto-prev" disabled>← Indietro</button>
          <div class="fumetto-dots" id="fumetto-dots" role="tablist" aria-label="Tavole"></div>
          <button type="button" class="btn btn-primary fumetto-nav" id="fumetto-next">Avanti →</button>
        </div>
        <p class="fumetto-hint">Scorri o tocca i lati. Pizzica per ingrandire. «Schermo intero» sul telefono.</p>
      </section>

      <div class="fumetto-actions">
        <a class="btn btn-primary" href="pdf/adone-fumetto.pdf" download>Scarica il fumetto (PDF)</a>
        <a class="btn btn-secondary" href="index.html">Le slide</a>
      </div>
    </main>

  </div>
  <script src="js/common.js" defer></script>
  <script src="../js/fumetto-zoom.js" defer></script>
  <script src="../js/fumetto-print.js?v=3" defer></script>
  <script src="js/fumetto.js" defer></script>
</body>
</html>
