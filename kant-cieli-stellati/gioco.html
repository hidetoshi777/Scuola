<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Gioco · Passeggiata di Königsberg | Scuola</title>
  <meta name="description" content="Gioco didattico su Kant: mappa di Königsberg con fermate, quiz e dilemmi sull’imperativo categorico.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gioco.css">
</head>
<body class="page-gioco">
  <a class="skip-link visually-hidden" href="#contenuto">Salta al contenuto</a>

  <aside class="astro-rail" aria-label="Navigazione">
    <a class="brand" href="index.html">KANT</a>
    <nav>
      <a href="index.html" title="Home">★</a>
      <a href="imparare.html" title="Imparare">ST</a>
      <a href="fumetto.html" title="Fumetto">FM</a>
      <a href="laboratorio.html" title="Laboratorio">LB</a>
      <a href="gioco.html" aria-current="page" title="Gioco">PS</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">CHIARO</button>
  </aside>

  <div class="shell">
    <main id="contenuto" class="gioco-main" tabindex="-1">
      <div class="gioco-top">
        <div>
          <p class="kicker">Ripasso · mappa</p>
          <h1>Passeggiata di Königsberg</h1>
          <p class="lead">Sei pin sulla mappa. A ogni fermata: domanda o dilemma. Non è arcade: serve per ripassare.</p>
        </div>
        <figure class="gioco-scene">
          <img src="img/tavole/04-dovere.jpg" alt="Tavola sul dovere e l’imperativo categorico" width="864" height="1152" loading="lazy">
        </figure>
      </div>

      <div class="gioco-hud" aria-live="polite">
        <span>Fermata <strong id="hud-stop">1</strong>/<span id="hud-total">6</span></span>
        <span>Punti <strong id="hud-score">0</strong></span>
        <button type="button" class="btn btn-secondary" id="btn-restart">Ricomincia</button>
      </div>

      <div class="city-map" id="city-map" aria-label="Mappa schematica di Königsberg">
        <svg viewBox="0 0 400 275" aria-hidden="true">
          <path class="river" d="M0 150 C 80 110, 140 190, 220 150 S 340 90, 400 130"/>
          <path class="route" d="M70 80 L140 55 L250 95 L310 150 L220 210 L90 180 Z"/>
        </svg>
      </div>

      <section class="stop-stage" id="stop-stage">
        <figure class="stop-art">
          <img id="stop-img" src="img/tavole/01-cieli.jpg" alt="" width="864" height="1152">
        </figure>
        <div class="stop-card" id="stop-card" aria-live="polite">
          <p class="stop-meta" id="stop-meta"></p>
          <h2 id="stop-title"></h2>
          <p id="stop-question"></p>
          <ul class="choice-list" id="choice-list"></ul>
          <div class="feedback" id="stop-feedback" hidden></div>
          <div class="hero-actions" style="margin-top:1rem">
            <button type="button" class="btn btn-primary" id="btn-next" hidden>Fermata successiva →</button>
          </div>
        </div>
      </section>

      <div class="gioco-end" id="gioco-end" hidden>
        <h2>Passeggiata completata</h2>
        <p id="end-text"></p>
        <div class="hero-actions">
          <button type="button" class="btn btn-primary" id="btn-again">Un altro giro</button>
          <a class="btn btn-secondary" href="laboratorio.html">Laboratorio</a>
          <a class="btn btn-secondary" href="fumetto.html">Fumetto</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>Realizzato dal Prof. Rossano Bella.</p>
      </div>
    </footer>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/gioco.js" defer></script>
</body>
</html>
