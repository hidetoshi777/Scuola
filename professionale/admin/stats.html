<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Statistiche visite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<body class="admin-page" data-theme="dark">
  <main class="admin-wrap admin-wrap--wide">

    <h1>Visite alle pagine</h1>
    <p class="admin-lead">Conteggi remoti (tutti i dispositivi). Hub professionale e attività collegate.</p>

    <div class="admin-toolbar">
      <div>
        <p class="admin-totale" id="stats-totale">—</p>
        <p class="admin-stato" id="stats-stato">Caricamento…</p>
      </div>
      <div class="admin-azioni">
        <button type="button" class="admin-btn admin-btn--primary" data-admin-refresh>Aggiorna</button>
        <button type="button" class="admin-btn admin-btn--ghost" data-admin-logout>Esci</button>
      </div>
    </div>

    <ul class="admin-lista" id="stats-lista" aria-live="polite"></ul>
  </main>
  <footer class="admin-footer">
    <p>Realizzato dal Prof. Rossano Bella</p>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
