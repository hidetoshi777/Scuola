<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <title>Accesso riservato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admin-page" data-theme="dark">
  <main class="admin-wrap">
    <p class="admin-eyebrow">Area riservata</p>
    <h1>Accesso</h1>
    <p class="admin-lead">Inserisci la password per vedere le visite alle pagine.</p>

    <form class="admin-card" id="admin-login" autocomplete="current-password">
      <label for="admin-password">Password</label>
      <input id="admin-password" name="password" type="password" required autocomplete="current-password" enterkeyhint="go">
      <div class="admin-azioni">
        <button type="submit" class="admin-btn admin-btn--primary">Entra</button>
        <a class="admin-btn admin-btn--ghost" href="../" style="text-decoration:none;display:inline-flex;align-items:center;">Indietro</a>
      </div>
      <p class="admin-errore" id="admin-errore" hidden></p>
      <p class="admin-hint">Solo per il docente. La sessione resta aperta in questa scheda per alcune ore.</p>
    </form>
  </main>
  <footer class="admin-footer">
    <p>Realizzato dal Prof. Rossano Bella</p>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
