<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Storia visiva · Edison | Scuola</title>
  <meta name="description" content="Visual story sul film Edison: Menlo Park, CC e CA, Tesla, Chicago 1893. Quarta professionale, tecnologie elettriche.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/vn.css">
  <link rel="preload" as="image" href="img/personaggi/prof.png" fetchpriority="high">
  <link rel="preload" as="image" href="img/player.png" fetchpriority="high">
</head>
<body class="page-gioco">
  <a class="skip-link visually-hidden" href="#contenuto">Salta al contenuto</a>

  <header class="ed-top">
    <a class="ed-brand" href="index.html">
      <span class="ed-brand-mark" aria-hidden="true"></span>
      Guerra delle correnti
    </a>
    <nav class="ed-nav" aria-label="Sezioni">
      <a href="index.html">Home</a>
      <a href="fumetto.html">Fumetto</a>
      <a href="gioco.html">Storia</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Chiaro</button>
  </header>

  <main id="contenuto" class="ed-wrap" tabindex="-1">
    <div class="vn-shell">
      <div class="vn-hud">
        <div class="vn-meta">
          <strong id="vn-capitolo">Prologo</strong>
          <span class="live">Il progresso resta su questo dispositivo.</span>
        </div>
        <div class="inline-actions">
          <div class="vn-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Avanzamento storia">
            <span id="vn-progress"></span>
          </div>
          <button type="button" class="btn btn-secondary" id="vn-riparti">Ricomincia</button>
          <button type="button" class="btn btn-secondary" data-audio-toggle aria-pressed="true">Suono: acceso</button>
        </div>
      </div>

      <section id="vn-stage" data-scena="intro" aria-live="polite">
        <div class="vn-backdrop" aria-hidden="true"></div>
        <p class="vn-scene-tag" id="vn-scena">Dopo il film</p>
        <div class="vn-cast">
          <img id="vn-avatar" class="vn-avatar" src="img/personaggi/prof.png" alt="" width="320" height="427">
        </div>
        <div class="vn-dialogue">
          <div class="vn-speaker-row">
            <strong id="vn-nome">Prof.</strong>
            <span id="vn-ruolo">Tecnologie elettriche</span>
          </div>
          <p id="vn-testo"></p>
          <div id="vn-scelte" class="vn-choices"></div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="vn-fine" aria-labelledby="vn-fine-titolo">
    <form method="dialog">
      <h2 id="vn-fine-titolo">Storia completata</h2>
      <p id="vn-fine-testo"></p>
      <div class="hero-actions">
        <button type="submit" class="btn btn-primary" value="ok">Chiudi</button>
        <button type="button" class="btn btn-secondary" data-vn-restart>Ricomincia</button>
        <a class="btn btn-secondary" href="fumetto.html">Vai al fumetto</a>
      </div>
      <p class="live" style="margin-top: 1rem;">Realizzato dal Prof. Rossano Bella.</p>
    </form>
  </dialog>

  <footer class="site-footer">
    <p>Visual story sul film Edison. Realizzato dal Prof. Rossano Bella.</p>
  </footer>

  <script src="js/common.js" defer></script>
  <script src="js/story.js" defer></script>
  <script src="js/engine.js" defer></script>
</body>
</html>
