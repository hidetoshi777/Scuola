<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d131b">
  <title>Parcheggia la Moke · Meucci</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/giochi.css?v=4">
</head>
<body class="parcheggio">
  <header class="barra">
    <a class="indietro" href="./" aria-label="Torna ai giochi">←</a>
    <div class="barra-titolo">
      <p class="barra-sopra" id="livello-nome">Livello 1</p>
      <h1>Parcheggia la Moke</h1>
    </div>
    <p class="barra-dati"><span id="tempo">0,0 s</span><span id="urti">0 urti</span></p>
  </header>

  <main class="campo">
    <canvas id="piazzale" aria-label="Il piazzale del plesso Meucci visto dall'alto"></canvas>
    <p class="suggerimento" id="suggerimento"></p>

    <div class="esito" id="esito" hidden>
      <div class="esito-scheda">
        <p class="esito-stelle" id="esito-stelle"></p>
        <h2 id="esito-titolo">Parcheggiata!</h2>
        <p id="esito-testo"></p>
        <div class="esito-azioni">
          <button type="button" class="bottone secondario" id="riprova">Riprova</button>
          <button type="button" class="bottone" id="prossimo">Livello successivo</button>
        </div>
      </div>
    </div>
  </main>

  <nav class="comandi" aria-label="Comandi">
    <div class="comandi-gruppo">
      <button type="button" class="tasto" data-tasto="sinistra" aria-label="Sterza a sinistra">⟲</button>
      <button type="button" class="tasto" data-tasto="destra" aria-label="Sterza a destra">⟳</button>
    </div>
    <div class="comandi-gruppo">
      <button type="button" class="tasto tasto-retro" data-tasto="indietro" aria-label="Retromarcia">R</button>
      <button type="button" class="tasto tasto-avanti" data-tasto="avanti" aria-label="Avanti">▲</button>
    </div>
  </nav>

  <script src="js/veicoli-sprite.js?v=3"></script>
  <script src="js/parcheggio.js?v=10"></script>
</body>
</html>
